name: pull_request

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  complete:
    if: always()
    needs: [fmt, build-and-test]
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1

  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt
    - run: cargo fmt --all --check
    - run: cargo fmt --manifest-path test-suites/fuzz/Cargo.toml --check

  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-deps-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'test-suites/fuzz/Cargo.lock') }}
        restore-keys: |
          cargo-deps-${{ runner.os }}-
    - run: rustup toolchain install 1.91.1 --profile minimal --component clippy --target wasm32v1-none
    - uses: stellar/stellar-cli@5a7c5fe76530bf4248477ac812fc757146b98cc4 # v27.0.0
      with:
        version: 27.0.0
    - run: make test
    - name: Capture optimized WASM sizes
      run: |
        mkdir -p "${RUNNER_TEMP}/wasm-size-report"
        make --no-print-directory wasm-size-report | tee "${RUNNER_TEMP}/wasm-size-report/report.md"
        cat "${RUNNER_TEMP}/wasm-size-report/report.md" >> "${GITHUB_STEP_SUMMARY}"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wasm-size-report-${{ github.sha }}
        path: ${{ runner.temp }}/wasm-size-report
        if-no-files-found: error
    - run: cargo clippy --workspace --all-targets --locked --message-format short
    - run: cargo clippy --manifest-path test-suites/fuzz/Cargo.toml --all-targets --locked --message-format short
