[workspace]
resolver = "2"

members = [
    "backstop",
    # SDK 27-compatible source replacements for the v2 dependency APIs.
    "compat/sep-40-oracle",
    "compat/sep-41-token",
    "compat/soroban-fixed-point-math",
    "compat/moderc3156",
    "pool",
    "mocks/mock-pool",
    "mocks/mock-pool-factory",
    # Source-based test mock replacing the SDK 22 precompiled emitter WASM.
    "mocks/mock-emitter",
    "mocks/moderc3156",
    "pool-factory",
    "test-suites",
    "backstop-valuation",
]

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
license = "AGPL-3.0"
publish = false

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[profile.release]
opt-level = "z"
overflow-checks = true # DEV: Do not remove this check - doing so will create vulnerabilities
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace.dependencies.soroban-sdk]
version = "=27.0.3"

[workspace.dependencies.soroban-fixed-point-math]
path = "compat/soroban-fixed-point-math"

[workspace.dependencies.cast]
version = "0.3.0"
default-features = false

[workspace.dependencies.sep-40-oracle]
path = "compat/sep-40-oracle"

[workspace.dependencies.sep-41-token]
path = "compat/sep-41-token"

[workspace.dependencies.moderc3156]
path = "compat/moderc3156"
